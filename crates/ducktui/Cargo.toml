[package]
name = "ducktui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal UI companion for duckspec — navigate scopes and drive agents"

[[bin]]
name = "ducktui"
path = "src/main.rs"

[dependencies]
duckcore.workspace = true
duckpond.workspace = true
duckchat.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
toml.workspace = true
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"
futures = "0.3"
pulldown-cmark = "0.12"

[dev-dependencies]
tempfile.workspace = true
