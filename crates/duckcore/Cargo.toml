[package]
name = "duckcore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared chat, scope, agent-core, and watcher logic for duckboard and ducktui"

[dependencies]
duckpond.workspace = true
duckchat.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml.workspace = true
dirs = "6"
time = { workspace = true, features = ["serde", "local-offset"] }
notify-debouncer-mini = "0.5"
ignore.workspace = true

[dev-dependencies]
tempfile.workspace = true
